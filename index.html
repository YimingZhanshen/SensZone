<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SensZone 灵敏域 · © YMZS</title>
    <meta name="author" content="YMZS" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#04070d" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta
      name="description"
      content="SensZone 灵敏域 —— 基于运动学分析与 Fitts 定律的 FPS 灵敏度区间查找器。© 2026 YMZS，保留所有权利。"
    />
    <meta name="copyright" content="© 2026 YMZS. All rights reserved." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='9'%20fill='none'%20stroke='%2300ffcc'%20stroke-width='2.5'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='2'%20fill='%2300ffcc'/%3E%3Cpath%20d='M16%202v7M16%2023v7M2%2016h7M23%2016h7'%20stroke='%2300ffcc'%20stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --primary: #00ffcc;
        --accent: #ff007b;
        --warn: #ffb020;
        --bg: #04070d;
        --panel: rgba(13, 24, 38, 0.96);
        --border: #1c3350;
        --text: #dbe7f3;
        --muted: #8aa0b4;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
      .hidden {
        display: none !important;
      }
      .muted {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .accent {
        color: var(--accent);
        margin-top: 8px;
      }

      #hud {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 5;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 16px;
        min-width: 220px;
        pointer-events: none;
      }
      #hud div {
        margin-bottom: 4px;
        font-family: monospace;
        font-size: 0.9rem;
      }
      #hud-hint {
        color: var(--primary);
        font-size: 0.8rem;
        font-family: inherit;
      }
      #hud-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: #0a1420;
        border-radius: 0 0 10px 10px;
        overflow: hidden;
        margin: 0;
      }
      #hud-bar {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.08s linear;
      }

      #feedback {
        position: absolute;
        left: 50%;
        bottom: 14%;
        transform: translateX(-50%);
        font-size: 1.4rem;
        font-weight: 700;
        opacity: 0;
        transition: opacity 0.15s;
        z-index: 6;
        pointer-events: none;
        text-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
      }
      #feedback.show {
        opacity: 1;
      }
      #feedback.hit {
        color: var(--primary);
      }
      #feedback.miss,
      #feedback.timeout {
        color: #ff3b5c;
      }
      #feedback.deny {
        color: var(--warn);
        font-size: 1rem;
      }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(2, 6, 12, 0.72);
        backdrop-filter: blur(3px);
        text-align: center;
      }
      #cd-title {
        font-size: 1.2rem;
        color: var(--muted);
      }
      #cd-num {
        font-size: 5rem;
        font-weight: 800;
        color: var(--primary);
        text-shadow: 0 0 30px var(--primary);
      }
      #cd-sub {
        color: var(--muted);
        font-size: 0.85rem;
      }

      #pause {
        gap: 14px;
      }
      #pause h2 {
        margin: 0;
        color: var(--primary);
      }

      .panel {
        position: absolute;
        z-index: 30;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--panel);
        border: 1px solid var(--primary);
        border-radius: 14px;
        padding: 26px 30px;
        width: 560px;
        max-width: 94vw;
        max-height: 92vh;
        overflow-y: auto;
        box-shadow: 0 0 60px rgba(0, 255, 204, 0.08);
      }
      #report {
        width: 860px;
        border-color: var(--border);
      }
      .panel h1 {
        margin: 0 0 4px 0;
        color: var(--primary);
        font-size: 1.6rem;
      }
      .panel h2 {
        margin: 0 0 12px 0;
        color: var(--primary);
      }
      .panel h3 {
        margin: 14px 0 8px 0;
        color: var(--primary);
        font-size: 1rem;
      }
      .tagline {
        margin: 0 0 18px 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 16px;
      }
      label {
        display: block;
        font-size: 0.75rem;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      label span {
        display: block;
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        padding: 8px 10px;
        background: #060d16;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 0.95rem;
      }
      input:focus,
      select:focus {
        outline: 1px solid var(--primary);
      }
      .chk {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0 6px;
        text-transform: none;
        font-size: 0.85rem;
        color: var(--text);
      }
      .chk input {
        width: auto;
      }

      .preview {
        margin: 12px 0 4px;
        padding: 10px 12px;
        background: #060d16;
        border: 1px dashed var(--primary);
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.85rem;
        color: var(--primary);
      }
      #fov-note {
        color: var(--muted);
        font-size: 0.75rem;
        margin: 4px 0 0;
      }
      #estimate {
        color: var(--muted);
        font-size: 0.8rem;
        margin: 6px 0 0;
      }

      .preflight {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        margin-top: 14px;
      }
      .preflight ul {
        margin: 6px 0;
        padding-left: 18px;
      }
      .preflight li {
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 4px;
      }
      #raw-status {
        font-size: 0.8rem;
        margin-top: 6px;
      }
      .raw-ok {
        color: var(--primary);
      }
      .raw-warn {
        color: var(--warn);
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        cursor: pointer;
        background: transparent;
        color: var(--primary);
        border: 1px solid var(--primary);
        border-radius: 8px;
        font-weight: 800;
        font-size: 1rem;
        text-transform: uppercase;
        transition:
          background 0.15s,
          color 0.15s;
      }
      button:hover {
        background: var(--primary);
        color: #000;
      }
      button.primary {
        background: var(--primary);
        color: #000;
      }
      button.primary:hover {
        filter: brightness(1.15);
      }
      button.danger {
        color: #ff3b5c;
        border-color: #ff3b5c;
      }
      button.danger:hover {
        background: #ff3b5c;
        color: #fff;
      }
      .btn-row {
        display: flex;
        gap: 10px;
      }
      .btn-row button {
        flex: 1;
      }

      #resume-row {
        display: flex;
        gap: 10px;
      }

      #history-box {
        margin-top: 18px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .hist-item {
        font-family: monospace;
        font-size: 0.8rem;
        color: var(--muted);
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      .hist-item:hover {
        background: #0a1826;
        color: var(--primary);
      }

      .card {
        background: #081320;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 18px;
        margin: 12px 0;
      }
      .card-title {
        color: var(--primary);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }
      .main-card {
        border-color: var(--primary);
      }
      .main-card .big {
        font-size: 2rem;
        font-weight: 800;
        color: var(--primary);
        margin: 4px 0;
      }
      .main-card .mid {
        font-size: 1.2rem;
        font-weight: 700;
        margin: 4px 0;
      }
      .badge {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
      }
      .badge.ok {
        background: rgba(0, 230, 118, 0.15);
        color: #00e676;
      }
      .badge.warn {
        background: rgba(255, 176, 32, 0.15);
        color: var(--warn);
      }
      .bucket-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .bucket-row .card {
        margin: 0;
      }
      .dual-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 8px 0;
      }
      .dual-row .mid {
        font-size: 1.05rem;
        margin: 4px 0;
      }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px 0;
        font-size: 0.85rem;
      }
      .slider-row input[type='range'] {
        flex: 1;
        accent-color: #00e676;
      }
      #version-note {
        margin-top: 14px;
        opacity: 0.7;
      }
      .warn-card {
        border-color: var(--warn);
      }
      .warn-card li {
        color: var(--warn);
        font-size: 0.85rem;
        margin-bottom: 4px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      th,
      td {
        padding: 6px 8px;
        text-align: left;
        border-bottom: 1px solid #10202f;
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
      td b {
        color: var(--primary);
      }
      .chart {
        width: 100%;
        height: 300px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud" class="hidden">
        <div id="hud-cond"></div>
        <div id="hud-trial"></div>
        <div id="hud-hint"></div>
        <div id="hud-progress"><div id="hud-bar"></div></div>
      </div>

      <div id="feedback"></div>

      <div id="countdown" class="overlay hidden">
        <div id="cd-title"></div>
        <div id="cd-num"></div>
        <div id="cd-sub"></div>
      </div>

      <div id="pause" class="overlay hidden">
        <h2 data-i18n="pauseTitle"></h2>
        <div style="width: 280px">
          <button id="btn-resume" data-i18n="resume"></button>
          <button id="btn-abort" class="danger" data-i18n="abort"></button>
        </div>
      </div>

      <div id="menu" class="panel">
        <h1 data-i18n="appTitle"></h1>
        <p class="tagline" data-i18n="tagline"></p>

        <h3 data-i18n="menuTitle"></h3>
        <div class="grid2">
          <label
            ><span data-i18n="game"></span>
            <select id="in-game">
              <option value="cs2">Counter-Strike 2</option>
              <option value="apex">Apex Legends</option>
              <option value="valorant">Valorant</option>
              <option value="overwatch">Overwatch 2</option>
              <option value="custom">Custom</option>
            </select>
          </label>
          <label
            ><span data-i18n="aspect"></span>
            <select id="in-aspect">
              <option value="4:3">4:3</option>
              <option value="16:9">16:9</option>
            </select>
          </label>
          <label id="row-custom-fov" class="hidden"
            ><span data-i18n="customFov"></span>
            <input id="in-fov" type="number" value="90" min="60" max="140" step="0.5" />
          </label>
          <label id="row-custom-yaw" class="hidden"
            ><span data-i18n="customYaw"></span>
            <input id="in-yaw" type="number" value="0.022" min="0.0001" max="1" step="0.001" />
          </label>
          <label
            ><span data-i18n="dpi"></span>
            <input id="in-dpi" type="number" value="800" min="100" max="32000" step="50" />
          </label>
          <label
            ><span data-i18n="sens"></span>
            <input id="in-sens" type="number" value="1.15" min="0.01" max="100" step="0.001" />
          </label>
          <label
            ><span data-i18n="trialsPerCond"></span>
            <select id="in-trials">
              <option value="16">16</option>
              <option value="24" selected>24</option>
              <option value="40">40</option>
              <option value="60">60</option>
            </select>
          </label>
          <label
            ><span data-i18n="taskMode"></span>
            <select id="in-task-mode">
              <option value="both" selected data-i18n="modeBoth"></option>
              <option value="flick" data-i18n="modeFlick"></option>
              <option value="track" data-i18n="modeTrack"></option>
            </select>
          </label>
          <label
            ><span data-i18n="padWidth"></span>
            <input
              id="in-pad"
              type="number"
              value=""
              min="10"
              max="100"
              step="1"
              placeholder="450mm = 45"
            />
          </label>
          <label
            ><span data-i18n="langLabel"></span>
            <select id="in-lang">
              <option value="zh-CN">中文</option>
              <option value="en">English</option>
            </select>
          </label>
        </div>

        <label class="chk"
          ><input type="checkbox" id="in-fullscreen" /> <span data-i18n="fullscreen"></span
        ></label>

        <div id="preview" class="preview"></div>
        <div id="fov-note" class="muted"></div>
        <div id="estimate"></div>

        <div class="preflight">
          <h3 data-i18n="preflight"></h3>
          <ul>
            <li data-i18n="chkOs"></li>
            <li data-i18n="chkDriver"></li>
            <li data-i18n="chkFull"></li>
            <li data-i18n="chkStill"></li>
          </ul>
          <div id="raw-status" class="raw-warn"></div>
        </div>

        <button id="btn-start" class="primary" data-i18n="startBtn"></button>

        <div id="resume-row" class="hidden">
          <button id="btn-resume-session" class="primary" data-i18n="resumeBtn"></button>
          <button id="btn-discard" class="danger" data-i18n="discardBtn"></button>
        </div>

        <div id="history-box">
          <h3 data-i18n="history"></h3>
          <canvas id="trend-chart" width="520" height="120"></canvas>
          <div id="trend-empty" class="muted hidden"></div>
          <div id="history-list"></div>
        </div>

        <div id="version-note" class="muted" data-i18n="versionNote"></div>
      </div>

      <div id="report" class="panel hidden"></div>
    </div>

    <script src="src/version.js?v=1.4.1"></script>
    <script src="src/math.js?v=1.4.1"></script>
    <script src="src/kinematics.js?v=1.4.1"></script>
    <script src="src/stats.js?v=1.4.1"></script>
    <script src="src/i18n.js?v=1.4.1"></script>
    <script src="src/render.js?v=1.4.1"></script>
    <script src="src/input.js?v=1.4.1"></script>
    <script src="src/task-flick.js?v=1.4.1"></script>
    <script src="src/task-track.js?v=1.4.1"></script>
    <script src="src/session.js?v=1.4.1"></script>
    <script src="src/analysis.js?v=1.4.1"></script>
    <script src="src/charts.js?v=1.4.1"></script>
    <script src="src/report-image.js?v=1.4.1"></script>
    <script src="src/ui.js?v=1.4.1"></script>
    <script src="src/main.js?v=1.4.1"></script>
    <script>
      if (
        'serviceWorker' in navigator &&
        location.protocol === 'https:' &&
        ['localhost', '127.0.0.1'].indexOf(location.hostname) === -1
      ) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    </script>
  </body>
</html>
